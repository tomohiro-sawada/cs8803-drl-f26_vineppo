[project]
name = "cs8803-drl-f26-vineppo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "jaxtyping>=0.3.11",
    "pylatexenc==2.10",
    "regex>=2023.12.25",
    "sympy==1.14.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"core.vendor.vineppo" = ["LICENSE.*", "NOTICE.md", "sources.json"]

[tool.pytest]
minversion = "9.2"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
strict_config = true
strict_markers = true
strict_xfail = true

[dependency-groups]
dev = [
    "jupyterlab>=4.6.5",
    "notebook>=7.6.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ruff-format>=0.5.4",
    "wandb>=0.31.0",
]
